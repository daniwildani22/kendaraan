<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A3981"/>
      <stop offset="50%" stop-color="#0B4F9C"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle circular speed ring track -->
  <circle cx="256" cy="260" r="140" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="26" stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round"/>
  <!-- Active Orange / Amber Progress Arc -->
  <circle cx="256" cy="260" r="140" fill="none" stroke="#F97316" stroke-width="26" stroke-dasharray="660" stroke-dashoffset="330" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Speedometer Center Hub -->
  <circle cx="256" cy="260" r="30" fill="#FFFFFF"/>
  <circle cx="256" cy="260" r="12" fill="#0B4F9C"/>

  <!-- Needle Pointing Up-Right -->
  <line x1="256" y1="260" x2="335" y2="180" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="260" x2="335" y2="180" stroke="#F97316" stroke-width="8" stroke-linecap="round"/>

  <!-- Small tick marks -->
  <circle cx="150" cy="305" r="7" fill="rgba(255,255,255,0.6)"/>
  <circle cx="180" cy="200" r="7" fill="rgba(255,255,255,0.6)"/>
  <circle cx="256" cy="155" r="8" fill="#F97316"/>
  <circle cx="330" cy="200" r="7" fill="rgba(255,255,255,0.6)"/>
  <circle cx="360" cy="305" r="7" fill="rgba(255,255,255,0.6)"/>
</svg>