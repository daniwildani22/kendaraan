name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor CLI
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icons services www/ 2>/dev/null || true

      - name: Create Capacitor Config
        run: |
          echo '{"appId":"com.kendaratrack.app","appName":"KendaraTrack","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

      - name: Setup Android Project
        run: |
          rm -rf android
          npx cap add android
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KendaraTrack-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
