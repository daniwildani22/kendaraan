name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js icons services www/ 2>/dev/null || true

      - name: Ensure Capacitor Config
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
            {
              "appId": "com.kendaratrack.app",
              "appName": "KendaraTrack",
              "webDir": "www",
              "server": {
                "androidScheme": "https"
              }
            }
            EOF
          fi

      - name: Setup Android Project
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            rm -rf android
            npx cap add android
          else
            npx cap sync android
          fi
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KendaraTrack-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
